<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aves Ornamentais Brasil — aves ornamentais à pronta entrega</title>
    <meta name="description" content="Aves ornamentais à pronta entrega de três criadouros parceiros: aquáticas, faisões, pavões, perdizes e mais. Rota de entrega marcada, pagamento na entrega." />
    <meta name="theme-color" content="#1F3B2E" />
    <link rel="canonical" href="https://avesornamentaisbrasil.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aves Ornamentais Brasil" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Aves Ornamentais Brasil — aves ornamentais à pronta entrega" />
    <meta property="og:description" content="Aves ornamentais à pronta entrega de três criadouros parceiros. Rota de entrega marcada, pagamento na entrega." />
    <meta property="og:url" content="https://avesornamentaisbrasil.com.br/" />
    <meta property="og:image" content="https://avesornamentaisbrasil.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Aves Ornamentais Brasil",
        "alternateName": "AOB",
        "url": "https://avesornamentaisbrasil.com.br/",
        "logo": "https://avesornamentaisbrasil.com.br/logo-selo-escuro.svg",
        "image": "https://avesornamentaisbrasil.com.br/og-image.png",
        "description": "Aves ornamentais à pronta entrega de criadouros parceiros, com rota de entrega a partir de São Paulo.",
        "email": "avesarca@gmail.com",
        "telephone": "+5511995610741",
        "areaServed": { "@type": "Country", "name": "Brasil" }
      }
    </script>
  </head>
  <body>
    <!-- Formulário estático oculto: a Netlify só reconhece formulários presentes no HTML do deploy.
         O envio real é feito pelo React (POST url-encoded para "/" com form-name=pedido). -->
    <form name="pedido" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="pedido" />
      <input type="text" name="subject" />
      <input type="text" name="codigo" />
      <input type="text" name="nome" />
      <input type="tel" name="whatsapp" />
      <input type="email" name="email" />
      <input type="text" name="cidade_uf" />
      <input type="text" name="regiao" />
      <input type="text" name="rota" />
      <input type="text" name="proxima_saida" />
      <input type="text" name="frete_zona" />
      <input type="text" name="frete_valor" />
      <input type="text" name="recebimento" />
      <textarea name="observacoes"></textarea>
      <textarea name="pedido_resumo"></textarea>
      <textarea name="pedido_json"></textarea>
      <input type="text" name="total_referencia" />
      <input type="text" name="origem" />
      <input type="text" name="pagina_entrada" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
