    <!--
      Identidade da empresa para o Google (schema.org). Fica no HTML servido, então é lido
      mesmo sem executar JavaScript. Ainda é "Organization" e não "LocalBusiness" porque o
      site não publica endereço — quando publicar, isto vira LocalBusiness e ajuda no Maps.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Aves Arca",
        "alternateName": "Criadouro Aves Arca",
        "url": "https://avesarca.com.br/",
        "logo": "https://avesarca.com.br/logo-original.svg",
        "image": "https://avesarca.com.br/og-image.jpg",
        "description": "Criadouro de anatídeos ornamentais de procedência — patos, marrecos, gansos e cisnes nascidos no plantel, com sanidade, bem-estar e legalidade documentados.",
        "email": "avesarca@gmail.com",
        "telephone": "+5511995610741",
        "sameAs": ["https://www.instagram.com/avesarca"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "telephone": "+5511995610741",
          "email": "avesarca@gmail.com",
          "availableLanguage": "Portuguese"
        },
        "areaServed": { "@type": "Country", "name": "Brasil" }
      }
    </script>
  </head>
  <body>
    <!--
      Formulário estático oculto — passo obrigatório em app de página única.
      A Netlify só reconhece um formulário que exista no HTML lido no momento do deploy;
      o envio de verdade é feito pelo React, via POST url-encoded para "/" com form-name=pre-reserva.
    -->
    <form name="pre-reserva" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="pre-reserva" />
      <!-- assunto do e-mail de aviso: a Netlify usa o campo chamado "subject" -->
      <input type="text" name="subject" />
      <input type="text" name="codigo" />
      <input type="text" name="nome" />
      <input type="tel" name="whatsapp" />
      <input type="email" name="email" />
      <!-- CPF OPCIONAL: adianta a NF e a GTA, que saem no nome de quem recebe a ave -->
      <input type="text" name="cpf" />
      <input type="text" name="cep" />
      <input type="text" name="endereco" />
      <input type="text" name="numero" />
      <input type="text" name="complemento" />
      <input type="text" name="bairro" />
      <input type="text" name="cidade_uf" />
      <input type="text" name="faixa_rota" />
      <input type="text" name="frete_zona" />
      <input type="text" name="frete_valor" />
      <input type="text" name="forma_recebimento" />
      <input type="text" name="forma_pagamento" />
      <input type="text" name="cupom" />
      <textarea name="observacoes"></textarea>
      <textarea name="pedido_resumo"></textarea>
      <textarea name="pedido_json"></textarea>
      <input type="text" name="total_referencia" />
      <input type="text" name="origem" />
      <input type="text" name="pagina_entrada" />
      <!-- confirmacao de maioridade: a NF e a GTA saem no nome de quem recebe a ave -->
      <input type="text" name="maior_idade" />
      <input type="text" name="bot-field" />
    </form>

    <!--
      Segundo formulário: quem ainda não vai comprar agora, mas quer ser avisado.
      Mesma regra da Netlify — precisa existir no HTML do deploy para ser reconhecido.
    -->
    <form name="lista-espera" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="lista-espera" />
      <input type="text" name="subject" />
      <input type="text" name="nome" />
      <input type="text" name="contato" />
      <input type="text" name="interesse" />
      <input type="text" name="origem" />
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
