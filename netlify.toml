# Configuração de build e funções do site Aves Ornamentais Brasil (AOB).
#
# Este arquivo existe porque o site passou a ser publicado a partir do repositório:
# a Netlify constrói sozinha a cada alteração enviada. Era o único caminho para ter
# funções serverless — a publicação por zip (Netlify Drop) NÃO sobe funções.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Toda rota real é pré-renderizada em dist/<rota>/index.html; o que não tem
# arquivo é endereço inexistente e sai com 404 de verdade (o React mostra a tela
# de "endereço não existe"). Antes era 200 para tudo — soft-404 para o Google.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Cache longo para o que tem hash no nome (o Vite troca o nome a cada build)
# e médio para fotos; o HTML continua sem cache para o deploy valer na hora.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# As faces têm peso e estilo no nome; trocar de fonte troca de arquivo.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/aves/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/aves-stima/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/criadouros/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # CSP: próprio site + fontes do Google + Meta Pixel (06/09) + Umami (07/09).
    # O Umami precisa de duas liberações: script-src para carregar o script.js
    # e connect-src para o beacon de cada evento, que sai para gateway.umami.is
    # (e não para cloud.umami.is — verificado no site da Arca em 07/09).
    # Já liberado para quando o Umami do AOB for ligado.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://connect.facebook.net https://cloud.umami.is; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://www.facebook.com; connect-src 'self' https://www.facebook.com https://connect.facebook.net https://cloud.umami.is https://gateway.umami.is; upgrade-insecure-requests"
