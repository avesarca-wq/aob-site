# Configuração de build e funções do site Aves Ornamentais Brasil (AOB).
#
# Este arquivo existe porque o site passou a ser publicado a partir do repositório:
# a Netlify constrói sozinha a cada alteração enviada. Era o único caminho para ter
# funções serverless — a publicação por zip (Netlify Drop) NÃO sobe funções.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# App de página única: qualquer rota desconhecida devolve o index.
# (o arquivo public/_redirects já faz isso; fica aqui como garantia)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # CSP: próprio site + fontes do Google + Meta Pixel (06/09) + Umami (07/09).
    # O Umami precisa de duas liberações: script-src para carregar o script.js
    # e connect-src para o beacon de cada evento, que sai para gateway.umami.is
    # (e não para cloud.umami.is — verificado no site da Arca em 07/09).
    # Já liberado para quando o Umami do AOB for ligado.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://connect.facebook.net https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://www.facebook.com; connect-src 'self' https://www.facebook.com https://connect.facebook.net https://cloud.umami.is https://gateway.umami.is; upgrade-insecure-requests"
