# Configuração de build e funções do site Aves Ornamentais Brasil (AOB).
#
# Este arquivo existe porque o site passou a ser publicado a partir do repositório:
# a Netlify constrói sozinha a cada alteração enviada. Era o único caminho para ter
# funções serverless — a publicação por zip (Netlify Drop) NÃO sobe funções.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# App de página única: qualquer rota desconhecida devolve o index.
# (o arquivo public/_redirects já faz isso; fica aqui como garantia)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # CSP mínima da v0.1: só o próprio site + fontes do Google. Ao ligar pixel/Umami/Supabase, liberar aqui.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; upgrade-insecure-requests"
