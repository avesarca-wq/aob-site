# Configuração de build e funções do site Aves Ornamentais Brasil (AOB).
#
# Este arquivo existe porque o site passou a ser publicado a partir do repositório:
# a Netlify constrói sozinha a cada alteração enviada. Era o único caminho para ter
# funções serverless — a publicação por zip (Netlify Drop) NÃO sobe funções.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Toda rota real é pré-renderizada em dist/<rota>/index.html; o que não tem
# arquivo é endereço inexistente e sai com 404 de verdade (o React mostra a tela
# de "endereço não existe"). Antes era 200 para tudo — soft-404 para o Google.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Cache longo para o que tem hash no nome (o Vite troca o nome a cada build)
# e médio para fotos; o HTML continua sem cache para o deploy valer na hora.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# As faces têm peso e estilo no nome; trocar de fonte troca de arquivo.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/aves/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/aves-stima/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/criadouros/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # HSTS com preload: um ano, subdomínios inclusive. Só faz sentido porque os
    # dois domínios servem tudo por HTTPS e não há subdomínio em HTTP.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # O site não usa câmera, microfone nem localização; negar é explicitar isso
    # para o navegador e para quem audita.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # A CSP NÃO mora aqui: ela muda por marca (só o AOB usa o Meta Pixel) e este
    # arquivo é um só para os três sites. Quem a escreve é scripts/prerender.mjs,
    # em dist/_headers, com os hosts de cada marca. Regra repetida nos dois
    # lugares faz a do netlify.toml vencer, então aqui não pode haver nenhuma.
