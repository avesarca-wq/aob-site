      <stop offset="0%" stop-color="#E55338"/>
      <stop offset="100%" stop-color="#B83820"/>
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D5A45"/>
      <stop offset="50%" stop-color="#2A4D3E"/>
      <stop offset="100%" stop-color="#1B3327"/>
