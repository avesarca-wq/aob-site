<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Viveiro 33 · Plantel Aves Arca</title><style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:#fbfaf7;color:#17282A;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
.kicker{font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:.25em;color:#C1732B;font-weight:700}
.marca{font-size:22px;letter-spacing:.3em;color:#14504B;margin-top:4px}
.regua{height:3px;background:#C1732B;width:64px;margin:10px 0 16px}
h1{font-size:26px;color:#14504B}
.sub{font-family:Arial,sans-serif;font-size:11px;color:#7a8886;margin-top:2px}
.cartao{background:#fff;border:1px solid #e4ded2;border-left:4px solid #14504B;padding:14px 16px;margin-top:14px;border-radius:2px}
.cartao h2{font-size:17px;color:#14504B;margin-bottom:6px}
.lbl{font-family:Arial,sans-serif;font-size:9.5px;letter-spacing:.12em;color:#8a9694;text-transform:uppercase}
.val{font-size:14.5px;margin-bottom:7px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.selo{display:inline-block;font-family:Arial,sans-serif;font-size:10px;font-weight:700;padding:2px 8px;border-radius:9px;border:1px solid #14504B;color:#14504B}
.selo.m{background:#14504B;color:#fff}
.vazio{background:#F1EBDD;border-left:4px solid #C1732B;padding:14px 16px;margin-top:14px;font-style:italic}
.rod{font-family:Arial,sans-serif;font-size:10px;color:#9aa5a3;margin-top:26px;border-top:1px solid #e4ded2;padding-top:8px}
a{color:#14504B}
.estr{font-family:Arial,sans-serif;font-size:11.5px;color:#5d6b69;margin-top:4px}
ul.idx{list-style:none;margin-top:12px}
ul.idx li{border-bottom:1px solid #eee8db;padding:7px 2px;display:flex;justify-content:space-between;font-size:15px}
</style></head><body><div class="wrap">
<div class="kicker">CURADORIA DE ESPÉCIES RARAS</div><div class="marca">AVES&nbsp;ARCA</div><div class="regua"></div>
<h1>Viveiro 33 <span style="font-size:15px;color:#8a9694">· Bloco G</span></h1>
<div class="estr">Núcleo 1 · 3 × 21 m · tanque 1.500 L</div>
<div id="limpeza"></div>
<div id="aves"><div class="vazio">Carregando a ficha…</div></div>
<div class="rod">Ficha viva do plantel · atualizada em <span id="ge">—</span> · uso interno — confira a anilha antes de qualquer manejo.<br>
Base: 13.3 Plantel Vivo (camada 13) · registro R1.2 · Ficha de Campo v1</div></div>
<script>
fetch('dados.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('ge').textContent=d.gerado_em;
  const lp=(d.limpeza&&d.limpeza.programacao&&d.limpeza.programacao['33'])||null;
  document.getElementById('limpeza').innerHTML=`
   <div class="cartao" style="border-left-color:#C1732B">
   <h2 style="font-size:14px">Limpeza</h2>
   ${lp?`<div class="grade">
     <div><div class="lbl">Dia programado</div><div class="val">${lp.dia||'—'}</div></div>
     <div><div class="lbl">Colaborador</div><div class="val">${lp.colab||'—'}</div></div></div>
     <div class="lbl">Produto padrão</div><div class="val">${lp.produto||'—'}</div>`:''}
   <a href="limpeza.html?v=33" style="display:block;text-align:center;background:#14504B;color:#fff;
     font-family:Arial,sans-serif;font-weight:bold;font-size:14px;letter-spacing:.08em;
     padding:12px;border-radius:3px;text-decoration:none;margin-top:6px">✓&nbsp;&nbsp;REGISTRAR LIMPEZA</a></div>`;
  const as=d.aves.filter(a=>a.viveiro===33);
  const el=document.getElementById('aves');
  if(!as.length){el.innerHTML='<div class="vazio">Sem aves registradas nesta unidade. Lançar na base 13.3 e regenerar.</div>';return;}
  el.innerHTML=as.map(a=>`
  <div class="cartao"><h2>${a.especie||'—'} <span class="selo ${a.classificacao==='Matriz'?'m':''}">${a.classificacao||'—'}</span></h2>
  <div class="grade">
  <div><div class="lbl">Anilha / ID</div><div class="val">${a.anilha||'—'}</div></div>
  <div><div class="lbl">Sexo</div><div class="val">${a.sexo||'—'}</div></div>
  <div><div class="lbl">Nascimento</div><div class="val">${a.nascimento||'—'}</div></div>
  <div><div class="lbl">Entrada</div><div class="val">${a.entrada||'—'}</div></div>
  <div><div class="lbl">Origem</div><div class="val">${a.origem||'—'}</div></div>
  <div><div class="lbl">GTA</div><div class="val">${a.gta||'—'}</div></div>
  <div><div class="lbl">Microchip</div><div class="val">${a.microchip||'—'}</div></div>
  <div><div class="lbl">Status</div><div class="val">${a.status||'—'}</div></div>
  </div>
  ${a.exames?`<div class="lbl">Últimos exames</div><div class="val">${a.exames}</div>`:''}
  ${a.obs?`<div class="lbl">Observações</div><div class="val">${a.obs}</div>`:''}
  </div>`).join('');
}).catch(()=>{document.getElementById('aves').innerHTML='<div class="vazio">Sem conexão — a ficha precisa de internet.</div>';});
</script></body></html>
